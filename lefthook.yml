pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: "**/*.{ts,tsx}"
          run: yarn format {staged_files}

        - name: lint
          glob: "**/*.{ts,tsx}"
          run: yarn lint {staged_files}

        - name: typecheck
          run: yarn typeCheck --noEmit

        - name: test
          run: npx vitest related --run {staged_files} 
