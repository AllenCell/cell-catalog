pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: "**/*.{ts,tsx}"
          run: npx prettier --check {staged_files}

        - name: lint
          glob: "**/*.{ts,tsx}"
          run: yarn lint {staged_files}

        - name: typecheck
          run: npx tsc --noEmit

        - name: test
          run: npx vitest run
